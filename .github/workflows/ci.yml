name: python_teszt
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  test:
   runs-on: ubuntu-latest
  
  steps:
    - name: Checkout repository
    uses: actions/checkout@v4

    - name: Setup python
    uses: actions/setup-python@v4

    - name: Függőségek
    run: pip install -r requirements.txt

    - name: Test
    run: pytest -v
    

    

    
